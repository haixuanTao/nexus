[workspace]
members = [
    "crates/nexus2d",
    "crates/nexus3d",
    "crates/nexus_viewer2d",
    "crates/nexus_viewer3d",
    "crates/examples2d",
    "crates/examples3d",
    "crates/nexus_rbd2d",
    "crates/nexus_rbd3d",
    "crates/nexus_rbd_shaders2d",
    "crates/nexus_rbd_shaders3d",
    "crates/nexus_mpm_shaders2d",
    "crates/nexus_mpm_shaders3d",
    "crates/nexus_mpm2d",
    "crates/nexus_mpm3d",
    "crates/nexus_fem_shaders2d",
    "crates/nexus_fem_shaders3d",
    "crates/nexus_fem2d",
    "crates/nexus_fem3d",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dimforge/nexus"

[workspace.dependencies]
glamx = { version = "0.3", default-features = false, features = ["nostd-libm", "bytemuck"] }
include_dir = "0.7"
khal-std = "0.2"
khal = { version = "0.2", features = ["derive"]}
vortx = "0.2"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
static_assertions = "1"
futures = "0.3"

# Shaders deps
khal-builder = "0.2"
vortx-shaders = { version = "0.2", default-features = false }
unroll = "0.1"
crunchy = "0.2.4"

[workspace.lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2", "dim3", "cpu", "cuda", "metal"))',
    'cfg(target_arch_is_gpu)',
] }

