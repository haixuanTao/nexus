[package]
name = "nexus_examples_2d"
version = "0.4.0"
authors = ["Sébastien Crozet <developer@crozet.re>"]
edition = "2024"

[features]
default = []
cpu = ["nexus_viewer2d/cpu"]
cpu-parallel = ["cpu", "nexus_viewer2d/cpu-parallel"]
cuda = ["nexus_viewer2d/cuda"]
metal = ["nexus_viewer2d/metal"]

[dependencies]
glamx = { version = "0.3", default-features = false }
nexus2d = { path = "../nexus2d", features = [ "rbd", "mpm", "fem" ] }
nexus_viewer2d = { path = "../nexus_viewer2d" }
nexus_rbd2d = { path = "../nexus_rbd2d" }
rapier2d = "0.33"
khal = { workspace = true }
Inflector = "0.11"
kiss3d = "0.44"
oorandom = "11"
rand = "0.10"
anyhow = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[[bin]]
name = "all_examples2"
path = "all_examples2.rs"
